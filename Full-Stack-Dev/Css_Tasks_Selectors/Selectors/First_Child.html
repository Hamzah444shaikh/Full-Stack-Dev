<!DOCTYPE html>
<html>
<head>
    <title>:first-child Example</title>
    <style>
        /* Select only the first list item */
        ul li:first-child {
            color: goldenrod;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <h2>:first-child Pseudo-Class Example</h2>
    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Mango</li>
        <li>Orange</li>
    </ul>
</body>
</html>
