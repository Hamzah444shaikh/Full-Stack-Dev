<!DOCTYPE html>
<html>
<head>
    <title>:last-child Example</title>
    <style>
        /* Select only the last list item */
        ul li:last-child {
            background-color: lightgreen;
            border: 2px solid green;
            padding: 5px;
        }
    </style>
</head>
<body>
    <h2>:last-child Pseudo-Class Example</h2>
    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Mango</li>
        <li>Orange</li>
    </ul>
</body>
</html>
