<!DOCTYPE html>
<html>
<head>
    <title>Child Selector Task</title>
    <style>
        div > p {
            background-color: lightblue;
            color: rgb(248, 5, 5);
            padding: 10px;
        }
    </style>
</head>
<body>
    <div>
        <p>This is the direct child paragraph.</p>
        <section>
            <p>This paragraph is inside the section.</p>
        </section>
    </div>
</body>
</html>
