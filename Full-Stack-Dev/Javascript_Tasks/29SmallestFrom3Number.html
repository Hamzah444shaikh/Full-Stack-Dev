<body>
    <h1>Task 26 Smallest From 3 Numbers</h1>
    <script>
         let num1 = 45;
        let num2 = 78;
        let num3 = 62;

        if (num1 <= num2 && num1 <= num3) {
            document.write("Smallest Number: " + num1);
        } else if (num2 <= num1 && num2 <= num3) {
            document.write("Smallest Number: " + num2);
        } else {
            document.write("Smallest Number: " + num3);
        }
    </script>
</body>
