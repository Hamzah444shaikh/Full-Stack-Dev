<!DOCTYPE html>

    <title>Task 14 Assignment Operator</title>
</head>
<body>
    <h1>Assignment Operator</h1>
    <script>
        // Assignment Operators
        let balance = 5000;
        // 1. Add 1500
        balance += 1500;
        // 2. Subtract 800
        balance -= 800;
        // 3. Multiply by 2
        balance *= 2;
        // 4. Divide by 4
        balance /= 4;
        // Display final balance
        console.log("Final Balance:", balance);
    </script>
</body>
