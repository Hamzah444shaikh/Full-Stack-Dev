<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 05 DataType Identification</title>
</head>
<body>
    <h1>DataType Identification</h1>
    <script>
        // Data Type Identification
        let personName = "Hamzah";
        let age = 20;
        let salary = 50000;
        let isEmployed = true;
        let emptyValue = null;
        let notAssigned;
        // Display values and their data types
        console.log(personName, "-", typeof personName);
        console.log(age, "-", typeof age);
        console.log(salary, "-", typeof salary);
        console.log(isEmployed, "-", typeof isEmployed);
        console.log(emptyValue, "-", typeof emptyValue);
        console.log(notAssigned, "-", typeof notAssigned);
    </script>
</body>
</html>
