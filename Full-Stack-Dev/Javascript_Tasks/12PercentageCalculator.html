<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 12 Percentage Calculator</title>
</head>
<body>
    <h1>Percentage Calculator</h1>
    <script>
        // Percentage Calculator
        let english = 78;
        let mathematics = 85;
        let science = 72;
        let computer = 90;
        let hindi = 81;
        // Calculate total marks
        let totalMarks = english + mathematics + science + computer + hindi;
        // Calculate percentage
        let percentage = (totalMarks / 500) * 100;
        // Display results
        console.log("Total Marks:", totalMarks);
        console.log("Percentage:", percentage + "%");
    </script>
</body>
</html>
