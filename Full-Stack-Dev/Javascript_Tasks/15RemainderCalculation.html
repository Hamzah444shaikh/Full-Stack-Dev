<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 15 Remainder Calculation</title>
</head>
<body>
    <h1>Remainder Calculation</h1>
    <script>
        // Remainder Calculation
        let totalStudents = 47;
        let studentsPerGroup = 5;
        // Calculate complete groups
        let completeGroups = Math.floor(totalStudents / studentsPerGroup);
        // Calculate students left over
        let studentsLeftOver = totalStudents % studentsPerGroup;
        // Display results
        console.log("Total Students:", totalStudents);
        console.log("Students Per Group:", studentsPerGroup);
        console.log("Complete Groups:", completeGroups);
        console.log("Students Left Over:", studentsLeftOver);
    </script>
</body>
</html>
