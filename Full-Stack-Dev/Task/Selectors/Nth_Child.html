<!DOCTYPE html>
<html>
<head>
    <title>Task 15 - :nth-child()</title>
    <style>
        li:nth-child(2) {
            color: red;
        }
        li:nth-child(4) {
            color: blue;
        }
        li:nth-child(6) {
            color: green;
        }
    </style>
</head>
<body>
    <h2>:nth-child() Example</h2>
    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
        <li>Item 5</li>
        <li>Item 6</li>
    </ul>
</body>
</html>
