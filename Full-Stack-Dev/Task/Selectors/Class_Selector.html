<!DOCTYPE html>
<html>
<head>
    <title>Class Selector Task</title>
    <style>
        .card {
            background-color: rgb(227, 224, 31);
            border: 8px solid rgba(250, 0, 0, 0.861);
            padding: 10px;
            margin: 10px;
        }
        .box {
            color: rgb(194, 13, 131);
            border: 8px solid rgb(16, 13, 176);
            padding: 10px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="card">Card 1</div>
    <div class="card">Card 2</div>
    <div class="card">Card 3</div>
    <div class="box">This is a Box</div>
</body>
</html>
