<!DOCTYPE html>
<html>
<head>
    <title>Task 16 - Even and Odd</title>
    <style>
        /* Odd items */
        li:nth-child(odd) {
            background-color: lightblue;
        }
        /* Even items */
        li:nth-child(even) {
            background-color: lightgreen;
        }
    </style>
</head>
<body>
    <h2>Even and Odd List Items</h2>
    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
        <li>Item 5</li>
        <li>Item 6</li>
        <li>Item 7</li>
        <li>Item 8</li>
    </ul>
</body>
</html>
