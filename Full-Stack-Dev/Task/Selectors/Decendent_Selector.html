<!DOCTYPE html>
<html>
<head>
    <title>Descendant Selector Task</title>
    <style>
        div p {
            color: rgb(239, 11, 11);
            border: 5px solid rgb(6, 40, 234);
            padding: 5px;
        }
    </style>
</head>
<body>
    <div>
        <p>This is the first paragraph inside the div.</p>
        <section>
            <p>This is the paragraph inside the section.</p>
        </section>
    </div>
    <p>This paragraph is outside the div.</p>
</body>
</html>
