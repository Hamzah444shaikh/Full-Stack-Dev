<!DOCTYPE html>
<html>
<head>
    <title>Adjacent Sibling Selector Task</title>
    <style>
        h1 + p {
            color:aqua;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <h1>Welcome to My Webpage Guys!</h1>
    <p>This is the first paragraph after the heading.</p>
    <p>This is the second paragraph after the heading.</p>
</body>
</html>
