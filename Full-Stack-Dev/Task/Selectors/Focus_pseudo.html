<!DOCTYPE html>
<html>
<head>
    <title>Focus Pseudo Class</title>
    <style>
        input {
            display: block;
            margin: 10px 0;
            padding: 8px;
            border: 2px solid gray;
        }
        /* Apply styles when input is focused */
        input:focus {
            border-color:green;
            background-color: greenyellow;
            outline: none;
        }
    </style>
</head>
<body>
    <h2>Focus Pseudo Class Example</h2>
    <input type="text" placeholder="Enter Username">
    <input type="password" placeholder="Enter Password">
</body>
</html>
