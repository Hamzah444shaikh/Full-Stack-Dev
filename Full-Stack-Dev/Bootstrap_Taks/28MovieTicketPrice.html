<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 28 Movie Ticket Price</title>
</head>
<body>
    <h1>Task 28 Movie Ticket Price</h1>
    <script>
        let age = 25;
        let isWeekend = true;
        let ticketPrice;

        if (age < 12) {
            ticketPrice = 100;
        } else if (age >= 60) {
            ticketPrice = 120;
        } else {
            ticketPrice = 200;
        }
        if (isWeekend) {
            ticketPrice += 50;
        }

        document.write("Age: " + age + "<br>");
        document.write("Weekend: " + isWeekend + "<br>");
        document.write("Final Ticket Price: ₹" + ticketPrice);
    </script>
</body>
</html>
