<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 04 Variable Reassignment</title>
</head>
<body>
    <h1>Variable Reassignment</h1>
    <script>
        // Variable Reassignment
        let city = "Ahmedabad"; // Original value
        console.log("Original City:", city);
        // Reassign a new value
        city = "Rajasthan";
        console.log("Updated City:", city);
    </script>
</body>
</html>
