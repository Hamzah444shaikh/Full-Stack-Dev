<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 09 Salary Calculation</title>
</head>
<body>
    <h1>salary Calculation</h1>
    <script>
        // Salary Calculation
        let basicSalary = 30000;
        // Calculate HRA and DA
        let hra = basicSalary * 0.20; // 20%
        let da = basicSalary * 0.10;  // 10%
        // Calculate Total Salary
        let totalSalary = basicSalary + hra + da;
        // Display results
        console.log("Basic Salary:", basicSalary);
        console.log("HRA (20%):", hra);
        console.log("DA (10%):", da);
        console.log("Total Salary:", totalSalary);
    </script>
</body>
</html>
