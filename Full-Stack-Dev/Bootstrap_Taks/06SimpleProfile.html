<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 06 SimpleProfile </title>
</head>
<body>
    <h1>SimpleProfile </h1>
    <script>
        // Simple Profile
        let firstName = "Hamzah";
        let lastName = "Shaikh";
        let age = 20;
        let height = 5.9; // in feet
        let isEmployed = true;
        // Display profile information
        console.log("----- Person Profile -----");
        console.log("First Name :", firstName);
        console.log("Last Name  :", lastName);
        console.log("Age        :", age);
        console.log("Height     :", height, "ft");
        console.log("Employed   :", isEmployed);
    </script>
</body>
