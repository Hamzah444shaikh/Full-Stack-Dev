<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 21 Positive , Negative or Zero</title>
</head>
<body>
    <h1>Task 21 Positive , Negative or Zero</h1>
    <script>
         let number = -15;
        if (number > 0) {
            document.write("The number is Positive");
        } else if (number < 0) {
            document.write("The number is Negative");
        } else {
            document.write("The number is Zero");
        }
    </script>
</body>
</html>
