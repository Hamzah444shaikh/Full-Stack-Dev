<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 13 Increment Decrement</title>
</head>
<body>
    <h1>Increment & Decrement</h1>
    <script>
        // Increment & Decrement
        let points = 100;
        console.log("Initial Points:", points);
        // Increase by 20
        points += 20;
        console.log("After Increasing by 20:", points);
        // Increase by 15
        points += 15;
        console.log("After Increasing by 15:", points);
        // Decrease by 10
        points -= 10;
        console.log("After Decreasing by 10:", points);
        // Decrease by 25
        points -= 25;
        console.log("After Decreasing by 25:", points);
    </script>
</body>
</html>
