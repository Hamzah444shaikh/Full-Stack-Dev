<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 07 Shopping Calculation</title>
</head>
<body>
    <h1>Shopping Calculation</h1>
    <script>
        // Shopping Calculation
        let productPrice = 750;
        let quantity = 4;
        // Calculate total price
        let totalPrice = productPrice * quantity;
        // Calculate GST (18%)
        let gst = totalPrice * 0.18;
        // Calculate final price including GST
        let finalPrice = totalPrice + gst;
        // Display results
        console.log("Total Price:", totalPrice);
        console.log("Price After 18% GST:", finalPrice);
    </script>
</body>
</html>
