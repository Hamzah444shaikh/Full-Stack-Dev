<body>
    <h1>Task 19 Number Comparision</h1>
    <script>
        // Task 19 - Number Comparison

        let num1 = 25;
        let num2 = 40;

        // Comparison
        console.log("First number is greater than second:", num1 > num2);
        console.log("First number is smaller than second:", num1 < num2);
        console.log("Both numbers are equal:", num1 === num2);
    </script>
</body>
