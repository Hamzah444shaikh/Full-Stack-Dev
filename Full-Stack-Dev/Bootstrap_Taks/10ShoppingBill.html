<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 10 Shopping Bill</title>
</head>
<body>
    <h1>Shopping Bill</h1>
    <script>
        // Shopping Bill
        let laptopPrice = 55000;
        let mousePrice = 800;
        let keyboardPrice = 1500;
        // Calculate total bill
        let totalBill = laptopPrice + mousePrice + keyboardPrice;
        // Display the bill
        console.log("Laptop Price: ₹" + laptopPrice);
        console.log("Mouse Price: ₹" + mousePrice);
        console.log("Keyboard Price: ₹" + keyboardPrice);
        console.log("Total Bill: ₹" + totalBill);
    </script>
</body>
