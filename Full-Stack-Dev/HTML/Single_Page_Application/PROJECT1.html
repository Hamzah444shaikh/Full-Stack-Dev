<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <table width="100%" border="01" height="900px" cellspacing="0" cellpadding="10">

            </td>

            <td width="20%" align="center">
                <img src="../HAMZAH/IMAGES/home.png" usemap="#homebtn" alt="Home Button" width="180" height="70">

                    <area shape="rect" coords="0,0,180,70" href="../HAMZAH/home.html" target="display" alt="HOME">

            </td>
